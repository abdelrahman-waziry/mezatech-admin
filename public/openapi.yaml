openapi: 3.0.0
info:
  title: Mezatech Backend API
  version: 1.0.0
servers:
  - url: https://admin.mezatech.net/api
security:
  - bearerAuth: []
tags:
  - name: Products
    description: API operations related to products
  - name: Brands
    description: API operations related to brands
  - name: Tags
    description: API operations related to tags
  - name: Variants
    description: API operations related to variants
  - name: Features
    description: API operations related to features
  - name: Parts
    description: API operations related to Parts
  - name: Analytics
    description: API operations related to Analytics Ingestion and Reporting

paths:
  /v1/analytics/requests:
    post:
      security: []
      tags:
        - Analytics
      summary: Ingest an API request log
      operationId: ingestAnalyticsRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsRequestData'
      responses:
        '201':
          description: Log created
        '400':
          description: Validation error

  /v1/analytics/events:
    post:
      security: []
      tags:
        - Analytics
      summary: Ingest a business event
      operationId: ingestAnalyticsEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsEventData'
      responses:
        '201':
          description: Event created
        '400':
          description: Validation error

  /v1/admin/analytics/performance:
    get:
      tags:
        - Analytics
      summary: Get API performance metrics
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: group_by
          in: query
          schema:
            type: string
            enum: [endpoint, day, hour]
            default: day
      responses:
        '200':
          description: Performance metrics

  /v1/admin/analytics/traffic:
    get:
      tags:
        - Analytics
      summary: Get traffic volume over time
      parameters:
        - name: interval
          in: query
          schema:
            type: string
            enum: [hour, day, month]
            default: day
      responses:
        '200':
          description: Traffic metrics

  /v1/admin/analytics/endpoints/top:
    get:
      tags:
        - Analytics
      summary: Get most used endpoints
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Top endpoints

  /v1/admin/analytics/tradeins/demand:
    get:
      tags:
        - Analytics
      summary: Get trade-in demand by device
      parameters:
        - name: group_by
          in: query
          schema:
            type: string
            enum: [model, brand]
            default: model
      responses:
        '200':
          description: Demand metrics

  /v1/trade-in-requests:
    get:
      tags:
        - TradeInRequests
      summary: Get all trade-in requests
      operationId: getTradeInRequests
      responses:
        '200':
          description: List of trade-in requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeInRequestsResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
    post:
      tags:
        - TradeInRequests
      summary: Create a new trade-in request
      operationId: createTradeInRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTradeInRequestDTO'
      responses:
        '201':
          description: Trade-in request created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /v1/trade-in-requests/{id}:
    put:
      tags:
        - TradeInRequests
      summary: Update a trade-in request
      operationId: updateTradeInRequest
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTradeInRequestDTO'
      responses:
        '200':
          description: Trade-in request updated
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
    delete:
      tags:
        - TradeInRequests
      summary: Delete a trade-in request
      operationId: deleteTradeInRequest
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Trade-in request deleted
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found

  /v1/products:
    get:
      tags:
        - Products
      summary: Get all products
      operationId: getProducts
      parameters:
        - name: name
          in: query
          required: false
          schema:
              type: string
        - name: tags
          in: query
          required: false
          schema:
              type: array
              items:
                type: string
        - name: minPrice
          in: query
          required: false
          schema:
              type: number
        - name: maxPrice
          in: query
          required: false
          schema:
              type: number
        - name: brands
          in: query
          required: false
          schema:
            type: array
            items:
              type: integer
              format: int64
        - name: condition
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductsResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
    post:
      tags:
        - Products
      summary: Create a new product
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductDTO'
      responses:
        '201':
          description: Product created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /v1/products/{id}:
    get:
      tags:
        - Products
      summary: Get a product by ID
      operationId: getProduct
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: includeParts
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDTO'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
    put:
      tags:
        - Products
      summary: Update a product
      operationId: updateProduct
