          type: array
          items:
            $ref: '#/components/schemas/VariantDTO'
    FeaturesResponse:
      type: object
      properties:
        features:
          type: array
          items:
            $ref: '#/components/schemas/FeatureDTO'
    CustomersResponse:
      type: object
      properties:
        customers:
          type: array
          items:
            $ref: '#/components/schemas/UserDTO'
    ProductDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        sku:
          type: string
        minimumBuyingPrice:
          type: number
        wastePrice:
          type: number
        condition:
          type: integer
          description: 0 is new, 1 is used, 2 is received from customer but not ready to be displayed, 3 is not received from customer
        brand:
          $ref: '#/components/schemas/BrandDTO'
        variants:
          type: array
          items:
            $ref: '#/components/schemas/VariantDTO'
        features:
          type: array
          items:
            $ref: '#/components/schemas/ProductFeatureDTO'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagDTO'
        parts:
          type: array
          items:
            $ref: '#/components/schemas/PartDTO'
        images:
          type: array
          items:
              type: string
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
        serialNumber:
          type: string
        imei:
          type: string

    CreateProductDTO:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        sku:
          type: string
        minimumBuyingPrice:
          type: number
        wastePrice:
          type: number
        condition:
          type: integer
          description: 0 is new, 1 is used, 2 is received from customer but not ready to be displayed, 3 is not received from customer
        brand:
          $ref: '#/components/schemas/SubDTO'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/SubDTO'
        notes:
          type: string

    ListProductDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        sku:
          type: string
        minimumBuyingPrice:
          type: number
        wastePrice:
          type: number
        condition:
          type: integer
          description: 0 is new, 1 is used, 2 is received from customer but not ready to be displayed, 3 is not received from customer
        brand:
          $ref: '#/components/schemas/BrandDTO'
        features:
          type: array
          items:
            $ref: '#/components/schemas/ProductFeatureDTO'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagDTO'
        images:
          type: array
          items:
            type: string
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
        serialNumber:
          type: string
        imei:
          type: string

    LoginDTO:
      type: object
      properties:
          email:
            type: string
          password:
            type: string

    ProductPriceCalculationRequest:
      type: object
      properties:
        variantId:
          type: integer
          format: int64
        repairedPartsBefore:
          type: array
          items:
            type: integer
            format: int64
        partsWithValuesMap:
          type: object
          description: A map with partId as key and part condition as value
          additionalProperties:
            type: string
        customer:
          $ref: '#/components/schemas/CustomerDTO'
      required:
        - variantId
        - repairedPartsBefore
        - partsWithValuesMap

    ProductPriceInfoDTO:
      type: object
      properties:
        price:
          type: number

    FileUploadRequest:
      type: object
      properties:
        entityType:
          type: string
          description: Type of the owning entity (e.g. product, variant)
        entityId:
          type: integer
          format: int64
          description: ID of the owning entity
      required:
        - entityType
        - entityId

    AnalyticsRequestData:
      type: object
      properties:
        request_id:
          type: string
          format: uuid
        endpoint:
          type: string
        method:
          type: string
          enum: [GET, POST, PUT, DELETE]
        timestamp:
          type: string
          format: date-time
        app_source:
          type: string
          enum: [web, ios, android, partner]
        app_version:
          type: string
        device:
          type: object
          properties:
            os:
              type: string
            model:
              type: string
            network:
              type: string
              enum: [wifi, cellular, unknown]
        response:
          type: object
          properties:
            status:
              type: integer
            duration_ms:
              type: integer
            error_type:
              type: string
              nullable: true
              enum: [validation_error, auth_error, server_error]

    AnalyticsEventData:
      type: object
      properties:
        event_name:
          type: string
          enum: [tradein_started, tradein_completed, requote_requested, quote_viewed]
        timestamp:
          type: string
          format: date-time
        user_id:
          type: string
          nullable: true
        context:
          type: object
          properties:
            brand:
              type: string
            model:
              type: string
            condition:
              type: string
              enum: [excellent, good, fair, damaged]
            quoted_price:
              type: number
        location:
          type: object
          properties:
            country:
              type: string
            city:
              type: string
            area:
              type: string
              nullable: true
            district:
              type: string
              nullable: true
        device:
          type: object
          properties:
            brand:
              type: string
            model:
              type: string
            os_version:
              type: string
    TradeInRequestDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        variantId:
          type: integer
          format: int64
        tradeInQuote:
          type: number
        customerName:
          type: string
        customerEmail:
          type: string
        customerPhone:
          type: string
        status:
          type: string
          enum: [pending, rejected, accepted]
        createdAt:
          type: string
          format: date-time
        selectedOptions:
          type: object
          description: A map with partId as key and part condition as value
          additionalProperties:
             type: integer
        customerAnswers:
          type: object
          description: A map with simplified question ID as key and user answer as value
          additionalProperties:
             type: integer

    CreateTradeInRequestDTO:
      type: object
      properties:
        variantId:
          type: integer
          format: int64
        tradeInQuote:
          type: number
        customerName:
          type: string
        customerEmail:
          type: string
        customerPhone:
          type: string
        status:
          type: string
          enum: [pending, rejected, accepted]
        selectedOptions:
          type: object
          description: A map with partId as key and part condition as value
          additionalProperties:
             type: integer
        customerAnswers:
          type: object
          description: A map with simplified question ID as key and user answer as value
          additionalProperties:
             type: integer
      required:
        - variantId
        - tradeInQuote
        - customerName
        - customerPhone
        - status

    UpdateTradeInRequestDTO:
      type: object
      properties:
        variantId:
          type: integer
          format: int64
        tradeInQuote:
          type: number
        customerName:
          type: string
        customerEmail:
          type: string
        customerPhone:
          type: string
        status:
          type: string
          enum: [pending, rejected, accepted]
        selectedOptions:
          type: object
          description: A map with partId as key and part condition as value
          additionalProperties:
             type: integer
        customerAnswers:
          type: object
          description: A map with simplified question ID as key and user answer as value
          additionalProperties:
             type: integer

    TradeInRequestsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TradeInRequestDTO'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
