          $ref: '#/components/schemas/FeatureValueDTO'
        variant:
          $ref: '#/components/schemas/VariantDTO'

    SingleVariantFeatureDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        feature:
          $ref: '#/components/schemas/SingleFeatureDTO'
        featureValue:
          $ref: '#/components/schemas/FeatureValueDTO'

    CreateVariantFeatureDTO:
