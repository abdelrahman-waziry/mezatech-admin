            $ref: '#/components/schemas/SingleVariantFeatureDTO'

    CreateVariantDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        stock:
          type: integer
        priceBeforeDiscount:
          type: number
        discount:
          type: number
        priceAfterDiscount:
          type: number
        buyingPrice:
          type: number
        variantFeatures:
          type: array
          items:
            $ref: '#/components/schemas/CreateVariantFeatureDTO'
