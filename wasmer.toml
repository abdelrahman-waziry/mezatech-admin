[package]
name = "mezatech-dashboard"
version = "1.0.0"
description = "MezaTech Laravel Admin Dashboard with Filament"
readme = "README.md"
license = "MIT"
repository = "https://github.com/abdelrahman-waziry/mezatech-admin"

[fs]
"/storage" = "storage"
"/bootstrap/cache" = "bootstrap/cache"
"/database" = "database"

[app]
type = "docker"
port = 8080

[build]
use = "docker"
dockerfile = "Dockerfile"

[env]
APP_NAME = "MezaTech Admin Panel"
APP_ENV = "production"
APP_DEBUG = "false"
APP_URL = "https://mezatech-dashboard.wasmer.app"
# IMPORTANT: Set APP_KEY in Wasmer deployment settings
# APP_KEY = "base64:your-key-here"

# Database - SQLite (recommended for Wasmer)
DB_CONNECTION = "sqlite"
DB_DATABASE = "/database/database.sqlite"

# Alternative: MySQL (requires external database service)
# DB_CONNECTION = "mysql"
# DB_HOST = "your-mysql-host"
# DB_PORT = "3306"
# DB_DATABASE = "mezatech_dashboard"
# DB_USERNAME = "your-username"
# DB_PASSWORD = "your-password"

# Session & Cache
SESSION_DRIVER = "file"
SESSION_LIFETIME = "120"
SESSION_ENCRYPT = "false"
CACHE_STORE = "database"

# Queue
QUEUE_CONNECTION = "database"

# Filesystem
FILESYSTEM_DISK = "local"

# Logging
LOG_CHANNEL = "stack"
LOG_STACK = "single"
LOG_LEVEL = "error"

# Mail
MAIL_MAILER = "log"
MAIL_FROM_ADDRESS = "hello@mezatech.com"
MAIL_FROM_NAME = "MezaTech Admin Panel"

# Locale
APP_LOCALE = "en"
APP_FALLBACK_LOCALE = "en"

# Best Repair API (set in Wasmer deployment settings)
# BEST_REPAIR_API_EMAIL = "your-email"
# BEST_REPAIR_API_PASSWORD = "your-password"

[health-check]
path = "/health"
interval = "30s"
timeout = "5s"
unhealthy-threshold = 3
