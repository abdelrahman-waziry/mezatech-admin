services:
  app:
    build: .
    restart: unless-stopped
    # Ports removed (handled by Caddy)
    environment:
      APP_NAME: "${APP_NAME:-Laravel}"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "${APP_URL:?APP_URL is required}"
      APP_KEY: "${APP_KEY:?APP_KEY is required}"
      RUN_MIGRATIONS: "true"
      QUEUE_CONNECTION: database
      DB_QUEUE_RETRY_AFTER: 660
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:?DB_DATABASE is required}"
      DB_USERNAME: "${DB_USERNAME:?DB_USERNAME is required}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
    volumes:
      - shared-storage:/var/www/html/storage
    depends_on:
      - db
    networks:
      - app-network

  worker:
    build: .
    restart: unless-stopped
    command: php artisan queue:work --timeout=600 --tries=1 --memory=512
    environment:
      APP_NAME: "${APP_NAME:-Laravel}"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "${APP_URL:?APP_URL is required}"
      APP_KEY: "${APP_KEY:?APP_KEY is required}"
      RUN_MIGRATIONS: "false"
      QUEUE_CONNECTION: database
      DB_QUEUE_RETRY_AFTER: 660
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:?DB_DATABASE is required}"
      DB_USERNAME: "${DB_USERNAME:?DB_USERNAME is required}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
    volumes:
      - shared-storage:/var/www/html/storage
    depends_on:
      - db
      - app
    networks:
      - app-network

  scheduler:
    build: .
    restart: unless-stopped
    command: php artisan schedule:work
    environment:
      APP_NAME: "${APP_NAME:-Laravel}"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "${APP_URL:?APP_URL is required}"
      APP_KEY: "${APP_KEY:?APP_KEY is required}"
      RUN_MIGRATIONS: "false"
      QUEUE_CONNECTION: database
      DB_QUEUE_RETRY_AFTER: 660
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:?DB_DATABASE is required}"
      DB_USERNAME: "${DB_USERNAME:?DB_USERNAME is required}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
    volumes:
      - shared-storage:/var/www/html/storage
    depends_on:
      - app
    networks:
      - app-network

  caddy:
    image: caddy:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN_NAME: "${DOMAIN_NAME:?DOMAIN_NAME is required}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - app-network

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:?DB_DATABASE is required}"
      MYSQL_USER: "${DB_USERNAME:?DB_USERNAME is required}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}"
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db-data:
  caddy_data:
  caddy_config:
  shared-storage:
